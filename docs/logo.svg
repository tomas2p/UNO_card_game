<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">UNO++ — The Card Game</title>
  <desc id="logo-desc">Logo ASCII de UNO++, el mismo que muestra el juego en la terminal.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182030"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="panel-clip">
      <rect x="1" y="1" width="678" height="238" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="678" height="238" rx="20" fill="url(#panel)" stroke="#2b3446" stroke-width="2"/>

  <!-- terminal title bar -->
  <circle cx="28" cy="21" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="5" fill="#27c93f"/>
  <text x="340.0" y="26" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#6b7688">UNO++ · THE CARD GAME</text>
  <line x1="1" y1="42" x2="679" y2="42" stroke="#2b3446" stroke-width="1"/>

  <!-- ASCII logo, from resources/art.txt -->
  <text x="87" y="80" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" fill="#e6edf3" xml:space="preserve" style="white-space: pre">
    <tspan x="87">  /$$   /$$  /$$   /$$   /$$$$$$</tspan>
    <tspan x="87" dy="18"> | $$  | $$ | $$$ | $$  /$$__  $$     /$$        /$$</tspan>
    <tspan x="87" dy="18"> | $$  | $$ | $$$$| $$ | $$  \ $$    | $$       | $$</tspan>
    <tspan x="87" dy="18"> | $$  | $$ | $$ $$ $$ | $$  | $$  /$$$$$$$$  /$$$$$$$$</tspan>
    <tspan x="87" dy="18"> | $$  | $$ | $$  $$$$ | $$  | $$ |__  $$__/ |__  $$__/</tspan>
    <tspan x="87" dy="18"> | $$  | $$ | $$\  $$$ | $$  | $$    | $$       | $$</tspan>
    <tspan x="87" dy="18"> |  $$$$$$/ | $$ \  $$ |  $$$$$$/    |__/       |__/</tspan>
    <tspan x="87" dy="18">  \______/  |__/  \__/  \______/</tspan>
  </text>

  <!-- UNO colors, clipped to the panel -->
  <g clip-path="url(#panel-clip)">
    <rect x="0" y="234" width="170" height="6" fill="#ef4444"/>
    <rect x="170" y="234" width="170" height="6" fill="#3b82f6"/>
    <rect x="340" y="234" width="170" height="6" fill="#22c55e"/>
    <rect x="510" y="234" width="170" height="6" fill="#f59e0b"/>
  </g>
</svg>
